version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    dev:
      dependency-type: development
      update-types: [minor, patch]
    # Groups without applies-to only cover version updates; security updates
    # need their own groups or they keep arriving one PR per package.
    dev-security:
      applies-to: security-updates
      dependency-type: development
      update-types: [minor, patch]
  ignore:
    # v10 needs conventional-changelog-writer@9, but
    # @semantic-release/release-notes-generator still ships writer@8.
    # Lift this once the generator moves to writer@9.
    - dependency-name: conventional-changelog-conventionalcommits
      update-types: [version-update:semver-major]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions:
      patterns: ["*"]
